# ===============================================
# Server & Application Configuration
# ===============================================
server.port=${SERVER_PORT:8081}
spring.application.name=product-service

# ===============================================
# MySQL Datasource Configuration
# ===============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/product_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# Spring Data JPA / Hibernate Configuration
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================================
# Eureka Client Configuration
# ===============================================
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

# ===============================================
# Downstream Service Configuration
# ===============================================
coupon-service.base-url=${COUPON_SERVICE_URL:http://localhost:8082}

# ===============================================
# Resilience4j Circuit Breaker: couponService
# ===============================================
resilience4j.circuitbreaker.instances.couponService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.couponService.sliding-window-size=10
resilience4j.circuitbreaker.instances.couponService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.couponService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.couponService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.couponService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.couponService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.couponService.record-exceptions=\
  org.springframework.web.client.RestClientException,\
  java.io.IOException,\
  java.util.concurrent.TimeoutException

# ===============================================
# SpringDoc / Swagger UI & OpenAPI Configuration
# ===============================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ===============================================
# Actuator & Circuit Breaker Health Exposure
# ===============================================
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
